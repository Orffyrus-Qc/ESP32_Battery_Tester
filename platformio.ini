; PlatformIO project for the ESP32 Non-Rechargeable Battery Tester
; ------------------------------------------------------------
; Install via `pio run -t upload`, or use the Arduino IDE
; (see README.md for library install: LiquidCrystal_I2C)
; ------------------------------------------------------------
; Vendored library (lib/LiquidCrystal_I2C) is picked up automatically.

[env:esp32dev]
platform        = espressif32
board           = esp32dev
framework       = arduino

monitor_speed   = 115200

build_flags =
    -w
    -ffunction-sections
    -fdata-sections
    -Wl,-gc-sections
